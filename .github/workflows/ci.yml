name: Build and test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Full default build: merged-corpus dictionary, every suite including the
  # end-to-end and dictionary-audit tests. This is the correctness gate.
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build both platforms and run all tests
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Platform Both -RunTests

  # The publishable artifact: license-clean starter dictionary. Built on every
  # push so a regression in this path is caught before a tag is cut.
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build the distributable package
        shell: pwsh
        run: ./package.ps1 -UseStarterDictionary

      - uses: actions/upload-artifact@v4
        with:
          name: Lekhoni-starter-package
          path: artifacts/Lekhoni-win-x86-x64.zip
          if-no-files-found: error
