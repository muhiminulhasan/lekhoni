name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The default package redistributes third-party-derived data under the
      # upstream licenses; the archive carries the compliance set those
      # licenses require (third-party-licenses\, THIRD_PARTY_NOTICES.md, and
      # the source-form TSVs under source\). Use -UseStarterDictionary for an
      # MIT-only package instead.
      - name: Build the distributable package
        shell: pwsh
        run: ./package.ps1

      - name: Compute SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath 'artifacts/Lekhoni-win-x86-x64.zip' -Algorithm SHA256).Hash
          "$($hash.ToLower())  Lekhoni-win-x86-x64.zip" | Out-File -Encoding ascii artifacts/checksums.txt
          Get-Content artifacts/checksums.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} `
            artifacts/Lekhoni-win-x86-x64.zip artifacts/checksums.txt `
            --title "Lekhoni ${{ github.ref_name }}" `
            --generate-notes `
            --notes "Unsigned integration build. Third-party-derived data ships under its upstream licenses (GPL-2.0+, MPL-2.0, CC BY-SA 3.0) with the compliance set included; see THIRD_PARTY_NOTICES.md and RELEASE_CHECKLIST.md." `
            --prerelease
          # Remove --prerelease once binaries are Authenticode-signed.
