name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The default package redistributes third-party-derived data under the
      # upstream licenses; the archive carries the compliance set those
      # licenses require (third-party-licenses\, THIRD_PARTY_NOTICES.md, and
      # the source-form TSVs under source\). Use -UseStarterDictionary for an
      # MIT-only package instead.
      - name: Build the distributable package
        shell: pwsh
        run: ./package.ps1

      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          $lines = @()
          foreach ($name in @('Lekhoni-win-x86-x64.zip', 'Lekhoni-win-x86-x64-lite.zip')) {
            $path = "artifacts/$name"
            if (Test-Path -LiteralPath $path) {
              $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
              $lines += "$($hash.ToLower())  $name"
            }
          }
          $lines | Out-File -Encoding ascii artifacts/checksums.txt
          Get-Content artifacts/checksums.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @('artifacts/Lekhoni-win-x86-x64.zip')
          if (Test-Path -LiteralPath 'artifacts/Lekhoni-win-x86-x64-lite.zip') {
            $assets += 'artifacts/Lekhoni-win-x86-x64-lite.zip'
          }
          $assets += 'artifacts/checksums.txt'
          gh release create ${{ github.ref_name }} $assets `
            --title "Lekhoni ${{ github.ref_name }}" `
            --generate-notes `
            --notes "Unsigned integration build. Two variants: the full package (with the trigram next-word prediction table) and the lite package (identical, without that table). Third-party-derived data ships under its upstream licenses (GPL-2.0+, MPL-2.0, CC BY-SA 3.0) with the compliance set included; see THIRD_PARTY_NOTICES.md and RELEASE_CHECKLIST.md." `
            --prerelease
          # Remove --prerelease once binaries are Authenticode-signed.
